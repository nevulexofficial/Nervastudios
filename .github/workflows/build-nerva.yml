name: Compilar APK de NERVA FC (Android Nativo)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Te permite compilar manualmente presionando un botón en GitHub Actions

jobs:
  build-apk:
    name: Compilando APK de NERVA (Nevulex)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código de NERVA
        uses: actions/checkout@v4

      - name: Configurar Entorno Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar Variables de Entorno y Keystore
        run: |
          # Asegurar existencia de archivo .env para Secrets Gradle Plugin
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          # Restaurar keystore de depuración si se exporta en base64
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          chmod +x gradlew

      - name: Ejecutar Compilador y Construir APK Nativo
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK Terminado a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NERVA-by-Nevulex-APK
          path: app/build/outputs/apk/debug/app-debug.apk
